<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="潤滑油商品">
  <meta name="theme-color" content="#f6f7f2">
  <link rel="apple-touch-icon" href="icon.png">
  <title>潤滑油 商品マスタ</title>
  <style>
    :root {
      --bg: #f6f7f2;
      --panel: #ffffff;
      --line: #d8ddd2;
      --line-strong: #b9c1b4;
      --text: #1f2520;
      --muted: #647064;
      --primary: #256d53;
      --primary-dark: #1b513e;
      --accent: #bf6b21;
      --danger: #c7372f;
      --danger-bg: #fff0ee;
      --shadow: 0 1px 2px rgba(31, 37, 32, 0.08);
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      font-size: 15px;
      letter-spacing: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      min-height: 36px;
      padding: 0 12px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    button:hover {
      background: #f1f4ee;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(37, 109, 83, 0.22);
      outline-offset: 1px;
    }

    .app {
      min-height: 100vh;
      padding: 18px;
    }

    .header {
      align-items: flex-start;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin: 0 auto 14px;
      max-width: 1380px;
    }

    .title-block {
      min-width: 0;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 4px 0 0;
    }

    .header-actions,
    .panel-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .nav-button {
      align-items: center;
      background: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      color: #fff;
      display: inline-flex;
      font-weight: 700;
      min-height: 36px;
      padding: 0 12px;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-button:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
      gap: 10px;
      margin: 0 auto 14px;
      max-width: 1380px;
    }

    .summary {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
      padding: 12px;
    }

    .summary .label {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 5px;
    }

    .summary .value {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .summary.total {
      border-left: 5px solid var(--primary);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin: 0 auto;
      max-width: 1380px;
      min-width: 0;
    }

    .panel-head {
      align-items: center;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 10px;
      justify-content: space-between;
      padding: 12px;
    }

    .panel-head h2 {
      font-size: 1rem;
      margin: 0;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .btn-accent {
      background: #fff4e8;
      border-color: #d99a60;
      color: #7b3f0f;
      font-weight: 700;
    }

    .btn-danger {
      background: #fff;
      border-color: #d8918c;
      color: var(--danger);
    }

    .file-button {
      align-items: center;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      min-height: 36px;
      padding: 0 12px;
      white-space: nowrap;
    }

    .file-button:hover {
      background: #f1f4ee;
    }

    .file-button input {
      display: none;
    }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0 12px 12px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      min-width: 1120px;
      width: 100%;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 7px 6px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f3f5ef;
      color: #3d473d;
      font-size: 0.8rem;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      background: #fff;
    }

    tbody tr.empty-row td {
      background: #fbfcf9;
    }

    .row-number {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
      width: 42px;
    }

    input,
    select {
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      color: var(--text);
      min-height: 34px;
      padding: 6px 8px;
      width: 100%;
    }

    input[hidden] {
      display: none;
    }

    input[type="number"] {
      min-height: 38px;
      text-align: center;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      white-space: nowrap;
    }

    .row-actions button {
      min-height: 32px;
      padding: 0 9px;
    }

    .toast {
      background: #263129;
      border-radius: var(--radius);
      bottom: 16px;
      color: #fff;
      left: 50%;
      opacity: 0;
      padding: 10px 14px;
      pointer-events: none;
      position: fixed;
      text-align: center;
      transform: translate(-50%, 10px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 10;
      max-width: min(92vw, 520px);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 900px) {
      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      .app {
        padding: 12px;
      }

      .header {
        display: block;
      }

      .header-actions {
        justify-content: stretch;
        margin-top: 10px;
      }

      .nav-button,
      .panel-actions button,
      .panel-actions .file-button {
        justify-content: center;
        width: 100%;
      }

      h1 {
        font-size: 1.25rem;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .panel-head {
        align-items: stretch;
        flex-direction: column;
      }

      .panel-actions {
        justify-content: stretch;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="title-block">
        <h1>潤滑油 商品マスタ</h1>
        <p class="subtitle">在庫登録前の商品候補を100件まで編集・保存</p>
      </div>
      <div class="header-actions">
        <a class="nav-button" href="index.html">在庫管理に戻る</a>
        <a class="nav-button" href="monthly.html">月次集計</a>
      </div>
    </header>

    <section class="summary-grid" aria-label="商品マスタ集計">
      <div class="summary total">
        <div class="label">登録済み候補</div>
        <div class="value" id="filledCount">0 件</div>
      </div>
      <div class="summary">
        <div class="label">空き行</div>
        <div class="value" id="emptyCount">100 件</div>
      </div>
      <div class="summary">
        <div class="label">在庫未登録候補</div>
        <div class="value" id="notInInventoryCount">0 件</div>
      </div>
    </section>

    <section class="panel" aria-label="商品マスタ編集">
      <div class="panel-head">
        <h2>商品候補 100行編集</h2>
        <div class="panel-actions">
          <button type="button" id="saveButton" class="btn-primary">保存</button>
          <button type="button" id="addInventoryButton">在庫へ追加</button>
          <button type="button" id="exportButton" class="btn-accent">CSV出力</button>
          <label class="file-button">
            CSV読込
            <input id="importInput" type="file" accept=".csv,text/csv">
          </label>
        </div>
      </div>
      <p class="hint">商品名が入っている行だけ保存対象です。「在庫へ追加」は、まだ在庫管理に存在しない商品だけを現在庫0で追加します。</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>商品名</th>
              <th>粘度/規格</th>
              <th>仕入先</th>
              <th>単位</th>
              <th>単価</th>
              <th>最低在庫</th>
              <th>メモ</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="productsBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const PRODUCT_STORAGE_KEY = "lubricantProductMaster.v1";
    const INVENTORY_STORAGE_KEY = "lubricantInventoryItems.v1";
    const MAX_ROWS = 100;
    const UNITS = ["ペール", "ドラム", "箱", "バラ"];
    const SUPPLIERS = ["上原成商事（株）", "株式会社ホクト", "中国精油株式会社"];
    const HEADERS = ["商品名", "粘度/規格", "仕入先", "単位", "単価", "最低在庫", "メモ"];

    const els = {
      filledCount: document.getElementById("filledCount"),
      emptyCount: document.getElementById("emptyCount"),
      notInInventoryCount: document.getElementById("notInInventoryCount"),
      productsBody: document.getElementById("productsBody"),
      saveButton: document.getElementById("saveButton"),
      addInventoryButton: document.getElementById("addInventoryButton"),
      exportButton: document.getElementById("exportButton"),
      importInput: document.getElementById("importInput"),
      toast: document.getElementById("toast")
    };

    let rows = padRows(loadProducts());

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function uid() {
      return "item-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }

    function numberValue(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num : 0;
    }

    function integerValue(value) {
      return Math.max(0, Math.trunc(numberValue(value)));
    }

    function sanitizeIntegerInput(input) {
      const cleaned = (String(input.value || "").match(/\d+/) || [""])[0];
      input.value = cleaned || "0";
    }

    function normalizeProduct(raw) {
      return {
        name: String(raw.name || "").trim(),
        spec: String(raw.spec || "").trim(),
        supplier: String(raw.supplier || "").trim(),
        unit: UNITS.includes(raw.unit) ? raw.unit : "バラ",
        price: integerValue(raw.price),
        minStock: integerValue(raw.minStock),
        memo: String(raw.memo || "").trim()
      };
    }

    function blankProduct() {
      return normalizeProduct({});
    }

    function padRows(products) {
      const next = products.slice(0, MAX_ROWS).map(normalizeProduct);
      while (next.length < MAX_ROWS) next.push(blankProduct());
      return next;
    }

    function hasProduct(product) {
      return Boolean(product.name || product.spec || product.supplier || product.memo || product.price || product.minStock);
    }

    function productKey(product) {
      return [product.name, product.spec, product.supplier].map(value => value.trim().toLowerCase()).join("||");
    }

    function loadProducts() {
      try {
        const saved = JSON.parse(localStorage.getItem(PRODUCT_STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved.map(normalizeProduct) : [];
      } catch (error) {
        console.warn("Failed to load product master:", error);
        return [];
      }
    }

    function loadInventory() {
      try {
        const saved = JSON.parse(localStorage.getItem(INVENTORY_STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        console.warn("Failed to load inventory:", error);
        return [];
      }
    }

    function saveInventory(items) {
      localStorage.setItem(INVENTORY_STORAGE_KEY, JSON.stringify(items));
    }

    function saveProducts() {
      const products = collectRows().filter(product => product.name);
      localStorage.setItem(PRODUCT_STORAGE_KEY, JSON.stringify(products.slice(0, MAX_ROWS)));
      rows = padRows(products);
      render();
      showToast("商品マスタを保存しました");
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function unitOptions(selected) {
      return UNITS.map(unit => `<option value="${unit}"${unit === selected ? " selected" : ""}>${unit}</option>`).join("");
    }

    function supplierSelectValue(supplier) {
      return !supplier || SUPPLIERS.includes(supplier) ? (supplier || SUPPLIERS[0]) : "その他";
    }

    function supplierOptions(selected) {
      const selectedValue = supplierSelectValue(selected);
      return SUPPLIERS.concat("その他").map(supplier => `<option value="${supplier}"${supplier === selectedValue ? " selected" : ""}>${supplier}</option>`).join("");
    }

    function render() {
      els.productsBody.innerHTML = "";
      rows.forEach((product, index) => {
        const tr = document.createElement("tr");
        if (!hasProduct(product)) tr.classList.add("empty-row");
        tr.innerHTML = `
          <td class="row-number">${index + 1}</td>
          <td><input data-field="name" data-index="${index}" value=""></td>
          <td><input data-field="spec" data-index="${index}" value=""></td>
          <td>
            <select data-field="supplierSelect" data-index="${index}">${supplierOptions(product.supplier)}</select>
            <input data-field="supplierOther" data-index="${index}" value="" placeholder="仕入先を入力" ${SUPPLIERS.includes(product.supplier) || !product.supplier ? "hidden" : ""}>
          </td>
          <td><select data-field="unit" data-index="${index}">${unitOptions(product.unit)}</select></td>
          <td><input type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*" data-field="price" data-index="${index}" value="${product.price}"></td>
          <td><input type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*" data-field="minStock" data-index="${index}" value="${product.minStock}"></td>
          <td><input data-field="memo" data-index="${index}" value=""></td>
          <td>
            <div class="row-actions">
              <button type="button" data-action="clear" data-index="${index}" class="btn-danger">クリア</button>
            </div>
          </td>
        `;
        tr.querySelector('[data-field="name"]').value = product.name;
        tr.querySelector('[data-field="spec"]').value = product.spec;
        tr.querySelector('[data-field="supplierOther"]').value = SUPPLIERS.includes(product.supplier) ? "" : product.supplier;
        tr.querySelector('[data-field="memo"]').value = product.memo;
        els.productsBody.appendChild(tr);
      });
      updateSummary();
    }

    function collectRows() {
      const products = [];
      for (let index = 0; index < MAX_ROWS; index++) {
        const field = name => {
          const input = els.productsBody.querySelector(`[data-index="${index}"][data-field="${name}"]`);
          return input ? input.value : "";
        };
        products.push(normalizeProduct({
          name: field("name"),
          spec: field("spec"),
          supplier: field("supplierSelect") === "その他" ? field("supplierOther") : field("supplierSelect"),
          unit: field("unit"),
          price: field("price"),
          minStock: field("minStock"),
          memo: field("memo")
        }));
      }
      return products;
    }

    function updateRowsFromInputs() {
      rows = padRows(collectRows());
    }

    function updateSummary() {
      const products = collectRows().filter(product => product.name);
      const inventoryKeys = new Set(loadInventory().map(item => productKey({
        name: item.name || "",
        spec: item.spec || "",
        supplier: item.supplier || ""
      })));
      const notInInventory = products.filter(product => !inventoryKeys.has(productKey(product))).length;
      els.filledCount.textContent = products.length + " 件";
      els.emptyCount.textContent = Math.max(0, MAX_ROWS - products.length) + " 件";
      els.notInInventoryCount.textContent = notInInventory + " 件";
    }

    function csvEscape(value) {
      const text = String(value ?? "");
      return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportCsv() {
      const products = collectRows().filter(product => product.name);
      const lines = [HEADERS.map(csvEscape).join(",")];
      for (const product of products) {
        lines.push([
          product.name,
          product.spec,
          product.supplier,
          product.unit,
          product.price,
          product.minStock,
          product.memo
        ].map(csvEscape).join(","));
      }
      const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "lubricant-product-master-" + today() + ".csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("商品マスタCSVを出力しました");
    }

    function parseCsv(text) {
      const csvRows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (quoted) {
          if (char === '"' && next === '"') {
            cell += '"';
            i++;
          } else if (char === '"') {
            quoted = false;
          } else {
            cell += char;
          }
        } else if (char === '"') {
          quoted = true;
        } else if (char === ",") {
          row.push(cell);
          cell = "";
        } else if (char === "\n") {
          row.push(cell);
          csvRows.push(row);
          row = [];
          cell = "";
        } else if (char !== "\r") {
          cell += char;
        }
      }

      if (cell || row.length) {
        row.push(cell);
        csvRows.push(row);
      }
      return csvRows;
    }

    function importCsv(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || "").replace(/^\ufeff/, "");
        const csvRows = parseCsv(text).filter(row => row.some(cell => String(cell).trim()));
        if (!csvRows.length) {
          showToast("読み込める行がありません");
          return;
        }
        const header = csvRows[0].map(value => value.trim());
        const hasHeader = header.includes("商品名");
        const dataRows = hasHeader ? csvRows.slice(1) : csvRows;
        const indexOf = name => hasHeader ? header.indexOf(name) : HEADERS.indexOf(name);
        const imported = dataRows.map(row => normalizeProduct({
          name: row[indexOf("商品名")],
          spec: row[indexOf("粘度/規格")],
          supplier: row[indexOf("仕入先")],
          unit: row[indexOf("単位")],
          price: row[indexOf("単価")],
          minStock: row[indexOf("最低在庫")],
          memo: row[indexOf("メモ")]
        })).filter(product => product.name).slice(0, MAX_ROWS);

        rows = padRows(imported);
        render();
        showToast(imported.length + "件を読み込みました。必要なら保存してください");
      };
      reader.readAsText(file, "utf-8");
    }

    function addToInventory() {
      const products = collectRows().filter(product => product.name);
      const inventory = loadInventory();
      const existing = new Set(inventory.map(item => productKey({
        name: item.name || "",
        spec: item.spec || "",
        supplier: item.supplier || ""
      })));
      let added = 0;

      for (const product of products) {
        const key = productKey(product);
        if (existing.has(key)) continue;
        inventory.push({
          id: uid(),
          name: product.name,
          spec: product.spec,
          supplier: product.supplier,
          stock: 0,
          minStock: product.minStock,
          unit: product.unit,
          price: product.price,
          monthlyIn: 0,
          monthlyInDate: "",
          monthlyOut: 0,
          monthlyOutDate: "",
          updatedAt: today(),
          memo: product.memo
        });
        existing.add(key);
        added++;
      }

      saveInventory(inventory);
      updateSummary();
      showToast(added ? added + "件を在庫管理へ追加しました" : "追加できる新規商品はありません");
    }

    els.productsBody.addEventListener("input", event => {
      const target = event.target.closest("[data-field]");
      if (!target) return;
      if (target.dataset.field === "price" || target.dataset.field === "minStock") {
        if (/[^\d]/.test(target.value)) sanitizeIntegerInput(target);
      }
      updateRowsFromInputs();
      updateSummary();
    });

    els.productsBody.addEventListener("change", event => {
      const target = event.target.closest("[data-field]");
      if (!target) return;
      if (target.dataset.field === "price" || target.dataset.field === "minStock") {
        sanitizeIntegerInput(target);
      }
      if (target.dataset.field === "supplierSelect") {
        const otherInput = els.productsBody.querySelector(`[data-index="${target.dataset.index}"][data-field="supplierOther"]`);
        if (otherInput) {
          otherInput.hidden = target.value !== "その他";
          if (target.value !== "その他") otherInput.value = "";
        }
      }
      updateRowsFromInputs();
      updateSummary();
    });

    els.productsBody.addEventListener("click", event => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const index = Number(target.dataset.index);
      if (target.dataset.action === "clear") {
        updateRowsFromInputs();
        rows[index] = blankProduct();
        render();
      }
    });

    els.saveButton.addEventListener("click", saveProducts);
    els.addInventoryButton.addEventListener("click", addToInventory);
    els.exportButton.addEventListener("click", exportCsv);
    els.importInput.addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (file) importCsv(file);
      event.target.value = "";
    });

    render();
  </script>
</body>
</html>
